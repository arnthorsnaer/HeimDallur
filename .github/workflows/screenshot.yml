name: UI Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # push screenshot commits to PR branch
  pull-requests: write   # update PR description

jobs:
  check-ui-changes:
    runs-on: ubuntu-latest
    outputs:
      ui_changed: ${{ steps.check.outputs.ui_changed }}
    steps:
      - name: Check for UI file changes
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const patterns = [
              /^heimdallur\/tui\//,
              /^heimdallur\/mock\//,
              /^scripts\/screenshot\.py$/,
              /^scripts\/capture_all\.py$/,
            ];
            const changed = files.some(f => patterns.some(p => p.test(f.filename)));
            core.setOutput('ui_changed', changed ? 'true' : 'false');
            core.info(`UI files changed: ${changed}`);

  screenshots:
    needs: check-ui-changes
    if: needs.check-ui-changes.outputs.ui_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: sudo apt-get install -y librsvg2-bin

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e . cairosvg

      - name: Generate all screenshots
        run: python scripts/capture_all.py --output-dir docs/screenshots
        env:
          NETWATCH_MOCK: "1"

      - name: Commit screenshots to PR branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/screenshots/
          if git diff --staged --quiet; then
            echo "Screenshots unchanged, skipping commit."
          else
            git commit -m "chore: update UI screenshots [skip ci]"
            git push
          fi

      - name: Update PR description with screenshot gallery
        uses: actions/github-script@v7
        with:
          script: |
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const prNum  = context.issue.number;
            const branch = context.payload.pull_request.head.ref;

            const normalBase = [
              "https://raw.githubusercontent.com",
              owner, repo, branch, "docs/screenshots"
            ].join("/");
            const tinyBase = normalBase + "/tiny";

            // Side-by-side pairs: normal (120×38) vs tiny (66×20)
            // Slugs must match scripts/capture_all.py CAPTURES and TINY_CAPTURES
            const pairs = [
              { normal: "01-status-healthy",           tiny: "t01-status-healthy",         title: "All healthy" },
              { normal: "02-status-internet-degraded", tiny: "t02-status-degraded",         title: "Internet degraded" },
              { normal: "06-status-multiple-issues",   tiny: "t03-status-multiple-issues",  title: "Multiple issues" },
              { normal: "07-inet-panel-expanded",      tiny: "t04-internet",                title: "Internet panel" },
              { normal: "08-net-panel-expanded",       tiny: "t05-home",                    title: "Home panel" },
            ];

            // Normal-mode-only captures (no tiny equivalent)
            const normalOnly = [
              { slug: "01b-status-email-configured",    title: "Email configured" },
              { slug: "03-status-internet-offline",     title: "Internet offline" },
              { slug: "04-status-router-offline",       title: "Router offline" },
              { slug: "05-status-gateway-offline",      title: "AP offline" },
              { slug: "07b-inet-panel-partial",         title: "Internet panel — partial failure" },
              { slug: "07c-inet-panel-offline",         title: "Internet panel — offline" },
              { slug: "06b-status-panel-expanded",      title: "Status banner expanded" },
              { slug: "08b-net-panel-gateway-offline",  title: "Home panel — AP offline" },
              { slug: "09-history-screen",              title: "History screen" },
              { slug: "10-devices-screen",              title: "Devices screen" },
            ];

            const pairRows = pairs.map(p =>
              `| **${p.title}** | **${p.title}** |\n` +
              `| ![${p.title} — normal](${normalBase}/${p.normal}.png) | ![${p.title} — tiny](${tinyBase}/${p.tiny}.png) |`
            ).join("\n");

            const normalOnlyRows = normalOnly.map(c =>
              `| **${c.title}** |\n| ![${c.title}](${normalBase}/${c.slug}.png) |`
            ).join("\n");

            const section = [
              "",
              "---",
              "## UI Screenshots",
              "",
              "### Normal mode (120×38) vs Tiny mode (66×20)",
              "",
              "| Normal | Tiny |",
              "|---|---|",
              pairRows,
              "",
              "### Normal mode only",
              "",
              normalOnlyRows,
              "",
              `<sub>Auto-generated from mock data — updated on every push.</sub>`,
            ].join("\n");

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNum,
            });

            const marker = "\n---\n## UI Screenshots";
            let body = pr.body ?? "";
            body = body.includes(marker)
              ? body.slice(0, body.indexOf(marker)) + section
              : body + section;

            await github.rest.pulls.update({
              owner, repo, pull_number: prNum, body,
            });

            core.info(`PR #${prNum} updated with ${pairs.length * 2 + normalOnly.length} screenshots.`);

  note-no-screenshots:
    needs: check-ui-changes
    if: needs.check-ui-changes.outputs.ui_changed == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Note no UI changes in PR description
        uses: actions/github-script@v7
        with:
          script: |
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const prNum  = context.issue.number;

            const section = [
              "",
              "---",
              "## UI Screenshots",
              "",
              "_No changes to TUI or mock files in this PR — screenshots not generated._",
              "",
            ].join("\n");

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNum,
            });

            const marker = "\n---\n## UI Screenshots";
            let body = pr.body ?? "";
            body = body.includes(marker)
              ? body.slice(0, body.indexOf(marker)) + section
              : body + section;

            await github.rest.pulls.update({
              owner, repo, pull_number: prNum, body,
            });

            core.info(`PR #${prNum} updated with no-screenshots note.`);
