[project]
name = "heimdallur"
version = "0.1.0"
description = "Home network health monitor for Raspberry Pi"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
heimdallur = "heimdallur.__main__:main"

[dependency-groups]
dev = [
    "watchfiles>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
