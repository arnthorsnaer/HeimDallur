[contacts]
network_admin       = "Network Admin"
home_network_admin_email = ""   # recipient address for incident report emails
isp_name            = "Demo ISP"

# Gmail account used to send incident report emails.
# Use a dedicated Gmail app password (Google Account -> Security -> App passwords).
# Leave both fields empty to disable email notifications.
[notification_email_gmail]
sender_email = ""   # e.g. "heimdallur.alerts@example.com"
app_password = ""   # 16-character Gmail app password

[network]
ont_check_host              = "8.8.8.8"
router_ip                   = "192.0.2.1"
probe_interval_seconds      = 30
speed_test_interval_seconds = 300

# -- Device Groups ----------------------------------------------------------
# type = "wifi" -> gateway_ip is a WiFi AP (probed; signal/clients shown)
# type = "lan"  -> gateway_ip is a managed switch (probed) or "" (unmanaged, not probed)
# If gateway_ip = "" the group only cascades on router failure.

[[groups]]
id            = "wifi-garage"
name          = "WiFi Garage"
type          = "wifi"
gateway_ip    = "192.0.2.25"
gateway_name  = "Garage AP"
gateway_model = "U6 Lite"
channel       = 11
band          = "2.4GHz"

[[groups]]
id            = "wifi-main"
name          = "WiFi Main Floor"
type          = "wifi"
gateway_ip    = "192.0.2.21"
gateway_name  = "Main Floor AP"
gateway_model = "U6 Pro"
channel       = 36
band          = "5GHz"

[[groups]]
id            = "wifi-upper"
name          = "WiFi Upper Floor"
type          = "wifi"
gateway_ip    = "192.0.2.22"
gateway_name  = "Upper Floor AP"
gateway_model = "U6 Pro"
channel       = 44
band          = "5GHz"

[[groups]]
id            = "wifi-lower"
name          = "WiFi Lower Floor"
type          = "wifi"
gateway_ip    = "192.0.2.23"
gateway_name  = "Lower Floor AP"
gateway_model = "U6 Lite"
channel       = 6
band          = "2.4GHz"

[[groups]]
id           = "lan-office"
name         = "LAN Office"
type         = "lan"
gateway_ip   = ""          # unmanaged switch - cascade only on router failure
gateway_name = ""

[[groups]]
id           = "lan-media"
name         = "LAN Media"
type         = "lan"
gateway_ip   = ""
gateway_name = ""

[[groups]]
id           = "lan-router"
name         = "LAN Router"
type         = "lan"
gateway_ip   = ""          # directly on router - cascade only on router failure
gateway_name = ""

