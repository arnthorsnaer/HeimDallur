[contacts]
network_admin = "Addi"
isp_name      = "Hringdu"

[network]
ont_check_host              = "8.8.8.8"
router_ip                   = "192.168.1.1"
probe_interval_seconds      = 30
speed_test_interval_seconds = 300

# ── Device Groups ──────────────────────────────────────────────
# type = "wifi"  → gateway_ip is a WiFi AP (probed; signal/clients shown)
# type = "lan"   → gateway_ip is a managed switch (probed) or "" (unmanaged, not probed)
# If gateway_ip = "" the group only cascades on router failure.

[[groups]]
id            = "wifi-garage"
name          = "WiFi Garage"
type          = "wifi"
gateway_ip    = "192.168.1.95"
gateway_name  = "Garage AP"
gateway_model = "U6 Lite"
channel       = 11
band          = "2.4GHz"

[[groups]]
id            = "wifi-main"
name          = "WiFi Living Room"
type          = "wifi"
gateway_ip    = "192.168.1.44"
gateway_name  = "Main AP"
gateway_model = "U6 Pro"
channel       = 36
band          = "5GHz"

[[groups]]
id            = "wifi-upper"
name          = "WiFi Upper Floor"
type          = "wifi"
gateway_ip    = "192.168.1.43"
gateway_name  = "Upper AP"
gateway_model = "U6 Pro"
channel       = 44
band          = "5GHz"

[[groups]]
id            = "wifi-lower"
name          = "WiFi Basement"
type          = "wifi"
gateway_ip    = "192.168.1.45"
gateway_name  = "Lower AP"
gateway_model = "U6 Lite"
channel       = 6
band          = "2.4GHz"

[[groups]]
id           = "lan-studio"
name         = "LAN Studio"
type         = "lan"
gateway_ip   = ""          # unmanaged switch — cascade only on router failure
gateway_name = ""

[[groups]]
id           = "lan-theater"
name         = "LAN Home Theater"
type         = "lan"
gateway_ip   = ""
gateway_name = ""

[[groups]]
id           = "lan-router"
name         = "LAN Router"
type         = "lan"
gateway_ip   = ""          # directly on router — cascade only on router failure
gateway_name = ""

